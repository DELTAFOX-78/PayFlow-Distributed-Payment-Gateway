# Shared by every service (served by config-service for all `{application}` names).
# Secrets are never stored here; they are read from environment variables.

infra:
  postgres:
    host: localhost
    port: 5432
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  zipkin:
    endpoint: http://localhost:9411/api/v2/spans

# Direct URLs used by the Feign clients (Eureka lookups are not used).
MERCHANT_SERVICE_URI: http://localhost:9010
PAYMENT_SERVICE_URI: http://localhost:9020
VAULT_SERVICE_URI: http://localhost:9040

spring:
  data:
    redis:
      host: ${infra.redis.host}
      port: ${infra.redis.port}
  kafka:
    bootstrap-servers: ${infra.kafka.bootstrap-servers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${infra.zipkin.endpoint}
  metrics:
    tags:
      application: ${spring.application.name}

# Kafka topics, keyed by lower-cased EventAggregateType (producers) and by the
# plural names the webhook consumer in operations-service listens on.
app:
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events
      payments: payments.events
      orders: orders.events
      refunds: refunds.events
      settlements: settlements.events
  rate-limit:
    method: sliding-lua   # fixed | sliding | sliding-lua | bucket
  security:
    trust-inbound-headers: true

# Resilience4j instances referenced by @CircuitBreaker / @Retry / @Bulkhead.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      merchant-service:
        base-config: default
      payment-service:
        base-config: default
      vault-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      merchant-service:
        base-config: default
      payment-service:
        base-config: default
      vault-service:
        base-config: default
